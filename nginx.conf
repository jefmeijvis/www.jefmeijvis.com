server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /post/001-csharp-extension-methods { return 308 /blog/001-csharp-extension-methods; }
    location = /post/002-multiple-teams-instances { return 308 /blog/002-managing-multiple-teams-instances; }
    location = /post/003-azure-functions-getting-started { return 308 /blog/003-azure-functions-part-1-getting-started; }
    location = /post/004-azure-functions-triggers-and-bindings { return 308 /blog/004-azure-functions-part-2-triggers-and-bindings; }
    location = /post/005-chat-application { return 308 /blog/005-creating-a-chat-component-with-svelte; }
    location = /post/006-sveltekit-api-endpoints { return 308 /blog/006-sveltekit-api-endpoints; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
